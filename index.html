<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frost Modz - Activación</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #07111f;
    color: white;
    font-family: Arial, sans-serif;
}

.card {
    width: 90%;
    max-width: 380px;
    padding: 30px 24px;
    text-align: center;
    background: #0d1b2e;
    border: 1px solid #2388ff;
    border-radius: 18px;
    box-shadow: 0 0 30px rgba(35,136,255,.25);
}

.icon {
    font-size: 48px;
    margin-bottom: 12px;
}

h1 {
    font-size: 25px;
    margin-bottom: 10px;
}

.message {
    color: #aebbd0;
    line-height: 1.5;
    margin-bottom: 22px;
}

input {
    width: 100%;
    padding: 14px;
    border: 1px solid #315477;
    border-radius: 10px;
    outline: none;
    background: #081525;
    color: white;
    text-align: center;
    font-size: 15px;
    margin-bottom: 14px;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2388ff;
    color: white;
    font-weight: bold;
    font-size: 15px;
}

#result {
    margin-top: 16px;
    min-height: 20px;
    font-size: 14px;
}

.success {
    color: #4dff91;
}

.error {
    color: #ff5d6c;
}

.credit {
    margin-top: 22px;
    color: #647995;
    font-size: 12px;
}
</style>
</head>

<body>

<div class="card">
    <div class="icon">🔑</div>

    <h1>Activación Requerida</h1>

    <p class="message">
        Ingresa tu key para continuar usando la aplicación.
    </p>

    <input id="keyInput" type="text" placeholder="Ingresa tu key">

    <button onclick="activateKey()">ACTIVAR KEY</button>

    <div id="result"></div>

    <div class="credit">Frost Modz</div>
</div>

<script>
const correctKey = "Frost-24-hours";
const durationHours = 24;

function activateKey() {
    const key = document.getElementById("keyInput").value.trim();
    const result = document.getElementById("result");

    if (key === correctKey) {
        const expires = Date.now() + durationHours * 60 * 60 * 1000;

        localStorage.setItem("frost_key", key);
        localStorage.setItem("frost_expiration", expires);

        result.className = "success";
        result.textContent = "✓ Key activada por 24 horas";
    } else {
        result.className = "error";
        result.textContent = "✕ Key incorrecta";
    }
}
</script>

</body>
</html>
