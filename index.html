<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frost Modz - Key System</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: #07111f;
    color: white;
}

.box {
    width: 90%;
    max-width: 380px;
    padding: 30px;
    text-align: center;
    background: #0d1b2a;
    border: 1px solid #2196f3;
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(33, 150, 243, 0.25);
}

h1 {
    color: #42a5f5;
    margin-top: 0;
}

p {
    color: #cfd8dc;
    line-height: 1.5;
}

input {
    width: 100%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #2196f3;
    border-radius: 10px;
    outline: none;
    background: #07111f;
    color: white;
    font-size: 15px;
    text-align: center;
}

button {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: #2196f3;
    color: white;
    font-size: 15px;
    font-weight: bold;
}

button:active {
    transform: scale(0.98);
}

#result {
    margin-top: 18px;
    font-weight: bold;
}

.success {
    color: #00e676;
}

.error {
    color: #ff5252;
}
</style>
</head>

<body>

<div class="box" id="mainBox">

    <h1>❄️ Frost Modz</h1>

    <p>
        🔑 Activación requerida<br>
        Introduce tu key para continuar.
    </p>

    <input
        id="key"
        type="text"
        placeholder="Introduce tu key"
        autocomplete="off"
    >

    <button onclick="activateKey()">
        ACTIVAR KEY
    </button>

    <div id="result"></div>

</div>

<script>

const CORRECT_KEY = "Frost-24-hours";

function activateKey() {

    const input = document
        .getElementById("key")
        .value
        .trim();

    const result = document.getElementById("result");

    if (input === CORRECT_KEY) {

        result.className = "success";
        result.textContent = "✅ Key activa por 24 horas";

        localStorage.setItem(
            "frost_key",
            CORRECT_KEY
        );

        localStorage.setItem(
            "frost_expiration",
            Date.now() + (24 * 60 * 60 * 1000)
        );

        setTimeout(function() {

            window.location.replace("about:blank");

        }, 1000);

    } else {

        result.className = "error";
        result.textContent = "❌ Key incorrecta";

    }
}

</script>

</body>
</html>
